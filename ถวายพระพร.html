<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ถวายพระพรชัยมงคล</title>
  <style>
    body {
      margin: 0;
      font-family: 'Sarabun', sans-serif;
      background-color: #ffb700; /* สีเหลืองทอง */
      text-align: center;
    }

    .banner {
      margin: 40px auto;
      max-width: 700px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      background-image: url('images/bg-pattern.png'); /* ใช้พื้นหลังถ้ามี */
      background-size: cover;
    }

    .banner img {
      width: 200px;
      border: 5px solid #c5a100;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .banner h1 {
      font-size: 1.8em;
      color: #3b240b;
      margin-bottom: 10px;
    }

    .banner p {
      font-size: 1.1em;
      color: #222;
      margin-bottom: 5px;
    }

    .button-group {
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      background-color: #fff4b0;
      border: 2px solid #b89100;
      color: #5c4400;
      font-weight: bold;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background-color: #f7e48d;
    }
  </style>
</head>
<body>

  <div class="banner">
    <img src="พระบรมฉายาลักษณ์.jpg" alt="พระบรมฉายาลักษณ์">
    <h1>วันฉัตรมงคล<br>๔ พฤษภาคม ๒๕๖๘</h1>
    <p>ด้วยเกล้าด้วยกระหม่อม ขอเดชะ</p>
    <p>ข้าพระพุทธเจ้า ข้าราชการ พนักงาน และประชาชน</p>
    <p>ขอพระองค์ทรงพระเจริญ</p>

    <div class="button-group">
      <a href="ลงนามถวายพระพร.html" class="button">ลงนามถวายพระพร</a>
    </div>
  </div>

</body>
</html>
